---
- name: Create a VM on VMware vSphere
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [vm-create]
  vars:
    datacenter: DC3
    cluster: PCA
    datastore: datastore3
    folder: "/{{ datacenter }}/vm"
    template: rhel9-template
    network: "VM Network"
  tasks:
    - name: Create the VM from the template
      community.vmware.vmware_guest:
        datacenter: "{{ datacenter }}"
        cluster: "{{ cluster }}"
        folder: "{{ folder }}"
        name: "{{ vm_name }}"
        template: "{{ template }}"
        datastore: "{{ datastore }}"
        state: poweredon
        hardware:
          num_cpus: "{{ vm_cpu | int }}"
          memory_mb: "{{ (vm_ram_gb | int) * 1024 }}"
        disk:
          - size_gb: "{{ vm_disk_gb | int }}"
            datastore: "{{ datastore }}"
        networks:
          - name: "{{ network }}"

- name: Adjust VM resources (CPU / RAM)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [vm-resize]
  vars:
    datacenter: DC3
    folder: "/{{ datacenter }}/vm"
  tasks:
    - name: Shut down the VM
      community.vmware.vmware_guest_powerstate:
        folder: "{{ folder }}"
        name: "{{ vm_name }}"
        state: shutdown-guest
        state_change_timeout: 300

    - name: Apply the new CPU and RAM
      community.vmware.vmware_guest:
        datacenter: "{{ datacenter }}"
        folder: "{{ folder }}"
        name: "{{ vm_name }}"
        hardware:
          num_cpus: "{{ vm_cpu | int }}"
          memory_mb: "{{ (vm_ram_gb | int) * 1024 }}"
        state: present

    - name: Power the VM on
      community.vmware.vmware_guest_powerstate:
        folder: "{{ folder }}"
        name: "{{ vm_name }}"
        state: powered-on

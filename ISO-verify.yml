- name: Vérification de conformité avec OpenSCAP
  hosts: all
  become: true
  vars:
    scap_profile: xccdf_org.ssgproject.content_profile_cis
    scap_content: "/usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml"
    report_dir: /var/log/openscap
  tasks:
    - name: Installer OpenSCAP et le contenu SCAP
      ansible.builtin.dnf:
        name:
          - openscap-scanner
          - scap-security-guide
        state: present

    - name: Créer le dossier des rapports
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"

    - name: Lancer le scan
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ scap_profile }}
        --results {{ report_dir }}/results.xml
        --report {{ report_dir }}/report.html
        {{ scap_content }}
      register: scan
      changed_when: false
      failed_when: scan.rc not in [0, 2]

---
- name: Install Open vSwitch
  hosts: all
  become: true
  collections:
    - community.general
  tasks:
    - name: Enable fast-datapath repository
      community.general.rhsm_repository:
        name: fast-datapath-for-rhel-9-x86_64-rpms
        state: enabled

    - name: Install Open vSwitch and NetworkManager-ovs
      ansible.builtin.dnf:
        name:
          - openvswitch3.3
          - NetworkManager-ovs
        state: present

    - name: Enable and start openvswitch
      ansible.builtin.systemd:
        name: openvswitch
        enabled: true
        state: started

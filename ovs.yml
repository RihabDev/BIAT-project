
---
- name: Install Open vSwitch
  hosts: all
  become: true

  tasks:
    - name: Enable fast-datapath repository
      ansible.builtin.command:
        argv:
          - subscription-manager
          - repos
          - --enable=fast-datapath-for-rhel-9-x86_64-rpms
      register: repo_enable
      changed_when: "'enabled' in repo_enable.stdout"

    - name: Install Open vSwitch and NetworkManager-ovs
      ansible.builtin.dnf:
        name:
          - openvswitch3.3
          - NetworkManager-ovs
        state: present

    - name: Enable and start openvswitch
      ansible.builtin.systemd:
        name: openvswitch
        enabled: true
        state: started

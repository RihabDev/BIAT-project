---
- name: Déploiement et configuration de l'agent Zabbix (RHEL)
  hosts: all
  become: yes
  vars:
    zabbix_server_ip: "" 
    zabbix_listen_port: "10050"

  tasks:
    - name: Installer le dépôt officiel Zabbix 6.4 (pour RHEL 9)
      ansible.builtin.dnf:
        name: https://repo.zabbix.com/zabbix/6.4/rhel/9/x86_64/zabbix-release-6.4-1.el9.noarch.rpm
        state: present
        disable_gpg_check: yes

    - name: Installer le paquet Zabbix Agent
      ansible.builtin.dnf:
        name: zabbix-agent
        state: present

    - name: Configurer le serveur Zabbix (contrôles passifs)
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^Server='
        line: "Server={{ zabbix_server_ip }}"
      notify: Redémarrer zabbix-agent

    - name: Configurer le serveur Zabbix (contrôles actifs)
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}"
      notify: Redémarrer zabbix-agent

    - name: Définir le nom d'hôte de l'agent
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^Hostname='
        line: "Hostname={{ inventory_hostname }}"
      notify: Redémarrer zabbix-agent

    - name: Autoriser le port Zabbix dans Firewalld
      ansible.posix.firewalld:
        port: "{{ zabbix_listen_port }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      ignore_errors: yes 

    - name: Activer et démarrer le service Zabbix Agent
      ansible.builtin.systemd:
        name: zabbix-agent
        state: started
        enabled: yes

  handlers:
    - name: Redémarrer zabbix-agent
      ansible.builtin.systemd:
        name: zabbix-agent
        state: restarted

- name: P1 - Common settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars: &settings
    rhel_reboot_after_update: false
    ssh_config_default:
      Port: "22"
      LogLevel: "INFO"
      ClientAliveInterval: "300"
      ClientAliveCountMax: "2"
      MaxSessions: "10"
    ssh_extra_lines: []                 
    ssh_verify_effective: true         
    ssh_config_effective: "{{ ssh_config | default(ssh_config_default) }}"

    ntp_servers: []             

    dns_servers: [8.8.8.8]
    dns_search: biat.local
    sysctl_settings:
      net.ipv4.ip_forward: "0"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.all.accept_source_route: "0"
      net.ipv4.icmp_echo_ignore_broadcasts: "1"
      net.ipv4.tcp_syncookies: "1"
      kernel.randomize_va_space: "2"
    scap_profile: xccdf_org.ssgproject.content_profile_cis_server_l1
    scap_content_dir: /usr/share/xml/scap/ssg/content
    scap_output_dir: /var/tmp/oscap
    scap_show_failed_max: 30          
    scap_fail_job_on_failed_rules: false

- name: RHEL automatic update
  hosts: rhel
  become: true
  gather_facts: false
  tags: [rhel-update]
  vars: *settings
  tasks:
    - name: Install dnf-utils
      ansible.builtin.dnf:
        name: dnf-utils
        state: present

    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest


- name: P1 - Windows Server automatic update
  hosts: windows
  gather_facts: false
  tags: [windows-update]
  vars: *settings
  tasks:
    - name: Install security and critical updates
      ansible.windows.win_updates:
        category_names: [SecurityUpdates, CriticalUpdates, UpdateRollups]
        reboot: true

- name: Centralized config (SSH, NTP, DNS, sysctl)
  hosts: rhel
  become: true
  gather_facts: false
  tags: [baseline]
  vars: *settings
  tasks:
    - name: Ensure sshd_config includes the drop-in directory
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/'
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        insertbefore: BOF
        validate: /usr/sbin/sshd -t -f %s
      tags: [ssh]

    - name: Deploy SSH configuration drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ansible.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          {% for key, value in ssh_config_effective.items() %}
          {{ key }} {{ value }}
          {% endfor %}
          {% for line in ssh_extra_lines %}
          {{ line }}
          {% endfor %}
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd
      tags: [ssh]

    - name: NTP (chrony)
      when: ntp_servers | length > 0
      tags: [ntp]
      block:
        - name: Install chrony
          ansible.builtin.dnf:
            name: chrony
            state: present

        - name: Deploy chrony.conf
          ansible.builtin.copy:
            dest: /etc/chrony.conf
            owner: root
            group: root
            mode: "0644"
            backup: true
            content: |
              {% for server in ntp_servers %}
              server {{ server }} iburst
              {% endfor %}
              driftfile /var/lib/chrony/drift
              makestep 1.0 3
              rtcsync
              logdir /var/log/chrony
          notify: Restart chronyd

        - name: Enable and start chronyd
          ansible.builtin.service:
            name: chronyd
            state: started
            enabled: true

    - name: Skip NTP because no server is defined
      ansible.builtin.debug:
        msg: "ntp_servers is empty, NTP configuration skipped"
      when: ntp_servers | length == 0
      tags: [ntp]

    - name: Gather network facts
      ansible.builtin.setup:
        gather_subset: [network]
      tags: [dns]

    - name: Find the NetworkManager connection of the default interface
      ansible.builtin.command: "nmcli -g GENERAL.CONNECTION device show {{ ansible_facts['default_ipv4']['interface'] }}"
      register: nm_con
      changed_when: false
      check_mode: false
      tags: [dns]

    - name: Stop if the interface has no NetworkManager connection
      ansible.builtin.assert:
        that: nm_con.stdout | length > 0 and nm_con.stdout != '--'
        fail_msg: "No active NetworkManager connection on {{ ansible_facts['default_ipv4']['interface'] }}"
        quiet: true
      tags: [dns]

    - name: Read DNS settings before
      ansible.builtin.command: "nmcli -g ipv4.dns,ipv4.dns-search,ipv4.ignore-auto-dns connection show '{{ nm_con.stdout }}'"
      register: dns_before
      changed_when: false
      check_mode: false
      tags: [dns]

    - name: Set DNS servers and search domain on the connection
      ansible.builtin.command: >-
        nmcli connection modify '{{ nm_con.stdout }}'
        ipv4.dns '{{ dns_servers | join(" ") }}'
        ipv4.dns-search '{{ dns_search }}'
        ipv4.ignore-auto-dns yes
      changed_when: false
      tags: [dns]

    - name: Read DNS settings after
      ansible.builtin.command: "nmcli -g ipv4.dns,ipv4.dns-search,ipv4.ignore-auto-dns connection show '{{ nm_con.stdout }}'"
      register: dns_after
      changed_when: false
      check_mode: false
      tags: [dns]

    - name: Apply to the running interface
      ansible.builtin.command: "nmcli device reapply {{ ansible_facts['default_ipv4']['interface'] }}"
      changed_when: dns_before.stdout != dns_after.stdout
      when: not ansible_check_mode
      tags: [dns]

    - name: Apply sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-ansible.conf
        sysctl_set: true
        reload: true
        state: present
      loop: "{{ (sysctl_settings | combine(sysctl_extra | default({}))) | dict2items }}"
      tags: [sysctl]

    - name: Apply pending handlers now
      ansible.builtin.meta: flush_handlers
      tags: [ssh, ntp]

    - name: Read effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_effective
      changed_when: false
      check_mode: false
      when: ssh_verify_effective | bool
      tags: [ssh]

    - name: Assert each configured directive is effective
      ansible.builtin.assert:
        that: (item.key | lower ~ ' ' ~ item.value | lower) in effective_lines
        fail_msg: "{{ item.key }} {{ item.value }} is not effective - another sshd file or Match block may override it"
        quiet: true
      vars:
        effective_lines: "{{ sshd_effective.stdout_lines | map('lower') | list }}"
      loop: "{{ ssh_config_effective | dict2items }}"
      when: ssh_verify_effective | bool and not ansible_check_mode
      tags: [ssh]

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded

    - name: Restart chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted

- name: Compliance check (CIS / ISO 27001) with OpenSCAP
  hosts: rhel
  become: true
  gather_facts: false
  tags: [compliance]
  vars: *settings
  tasks:
    - name: Gather minimal facts (OS major version)
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Install OpenSCAP scanner and SCAP Security Guide content
      ansible.builtin.dnf:
        name: [openscap-scanner, scap-security-guide]
        state: present

    - name: Set the SCAP datastream path
      ansible.builtin.set_fact:
        scap_datastream: "{{ scap_content_dir }}/ssg-rhel{{ ansible_facts['distribution_major_version'] }}-ds.xml"

    - name: Check that the datastream exists
      ansible.builtin.stat:
        path: "{{ scap_datastream }}"
      register: ds_stat

    - name: Stop if the datastream is missing
      ansible.builtin.assert:
        that: ds_stat.stat.exists
        fail_msg: "{{ scap_datastream }} not found - check the scap-security-guide package for this RHEL version"
        quiet: true

    - name: List the profiles available in the SCAP content
      ansible.builtin.command: "oscap info --profiles {{ scap_datastream }}"
      register: scap_profiles
      changed_when: false
      tags: [never, scap-profiles]

    - name: Show available profiles
      ansible.builtin.debug:
        var: scap_profiles.stdout_lines
      tags: [never, scap-profiles]

    - name: Create the output directory
      ansible.builtin.file:
        path: "{{ scap_output_dir }}"
        state: directory
        mode: "0750"

    - name: Run the OpenSCAP scan
      ansible.builtin.command: >-
        oscap xccdf eval
        --profile {{ scap_profile }}
        --results {{ scap_output_dir }}/results.xml
        --report {{ scap_output_dir }}/report.html
        {{ scap_datastream }}
      register: oscap
      changed_when: false
      failed_when: oscap.rc not in [0, 2]   
      check_mode: false
      async: 1800
      poll: 15

    - name: Count the results
      ansible.builtin.set_fact:
        scap_pass: "{{ oscap.stdout_lines | select('match', '^Result.*pass$') | list | length }}"
        scap_fail: "{{ oscap.stdout_lines | select('match', '^Result.*fail$') | list | length }}"

    - name: List the first failed rules
      ansible.builtin.shell: |
        awk '/^Title/{t=$0} /^Result[[:space:]]+fail/{print t}' | head -n {{ scap_show_failed_max }}
      args:
        stdin: "{{ oscap.stdout }}"
      register: failed_titles
      changed_when: false
      check_mode: false
      when: scap_fail | int > 0

    - name: Compliance summary
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ scap_pass }} rules passed, {{ scap_fail }} failed"
          - "Profile: {{ scap_profile | regex_replace('^.*profile_', '') }}"
          - "Full HTML report on the host: {{ scap_output_dir }}/report.html"
          - "{{ failed_titles.stdout_lines | default([]) }}"

    - name: Fail the job if rules failed
      ansible.builtin.fail:
        msg: "{{ scap_fail }} OpenSCAP rule(s) failed on {{ inventory_hostname }}"
      when: (scap_fail | int > 0) and (scap_fail_job_on_failed_rules | bool)

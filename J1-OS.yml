---
- name: Update RHEL
  hosts: rhel
  become: true
  gather_facts: false
  tags: [rhel-update]
  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

- name: Update Windows Server
  hosts: windows
  gather_facts: false
  tags: [windows-update]
  tasks:
    - name: Install security and critical updates
      ansible.windows.win_updates:
        category_names: [SecurityUpdates, CriticalUpdates, UpdateRollups]
        reboot: true

- name: Central configuration (SSH, NTP, DNS, sysctl)
  hosts: rhel
  become: true
  gather_facts: false
  vars:
    ssh_config:
      Port: "22"
      LogLevel: "INFO"
      ClientAliveInterval: "300"
      ClientAliveCountMax: "2"
      MaxSessions: "10"
    ntp_servers: [] 
    dns_servers: [8.8.8.8]
    dns_search: biat.local
    sysctl_settings:
      net.ipv4.ip_forward: "0"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.tcp_syncookies: "1"
      kernel.randomize_va_space: "2"
  tasks:
    - name: Configure SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*{{ item.key }}\s'
        line: "{{ item.key }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
      loop: "{{ ssh_config | dict2items }}"
      notify: Restart sshd
      tags: [ssh]

    - name: Install chrony
      ansible.builtin.dnf:
        name: chrony
        state: present
      tags: [ntp]

    - name: Configure NTP
      ansible.builtin.copy:
        dest: /etc/chrony.conf
        mode: "0644"
        content: |
          {% for server in ntp_servers %}
          server {{ server }} iburst
          {% endfor %}
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
      notify: Restart chronyd
      tags: [ntp]

    - name: Start and enable chronyd
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true
      tags: [ntp]

    - name: Configure DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          search {{ dns_search }}
          {% for server in dns_servers %}
          nameserver {{ server }}
          {% endfor %}
      tags: [dns]

    - name: Apply sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-ansible.conf
        reload: true
        state: present
      loop: "{{ sysctl_settings | dict2items }}"
      tags: [sysctl]

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted

- name: Compliance check (CIS / ISO 27001) with OpenSCAP
  hosts: rhel
  become: true
  tags: [compliance]
  vars:
    scap_profile: xccdf_org.ssgproject.content_profile_cis_server_l1
  tasks:
    - name: Install OpenSCAP and the security content
      ansible.builtin.dnf:
        name: [openscap-scanner, scap-security-guide]
        state: present

    - name: Run the OpenSCAP scan
      ansible.builtin.command: >-
        oscap xccdf eval
        --profile {{ scap_profile }}
        --report /var/tmp/oscap-report.html
        /usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml
      register: oscap
      changed_when: false
      failed_when: oscap.rc not in [0, 2]
      async: 1800
      poll: 15

    - name: Show the result
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ oscap.stdout_lines | select('match', '^Result.*pass$') | list | length }} rules passed, {{ oscap.stdout_lines | select('match', '^Result.*fail$') | list | length }} failed"
          - "HTML report on the host: /var/tmp/oscap-report.html"

---
- name: Déploiement standardisé du serveur d'application (Tomcat)
  hosts: all
  become: yes
  vars:
    tomcat_version: "9.0.87"
    tomcat_url: "https://archive.apache.org/dist/tomcat/tomcat-9/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
    tomcat_dir: "/opt/tomcat"
    tomcat_port: "8080"

  tasks:
    - name: Installer Java (OpenJDK 11)
      ansible.builtin.dnf:
        name: java-11-openjdk
        state: present

    - name: Créer le groupe système tomcat
      ansible.builtin.group:
        name: tomcat
        state: present

    - name: Créer l'utilisateur système tomcat
      ansible.builtin.user:
        name: tomcat
        group: tomcat
        home: "{{ tomcat_dir }}"
        shell: /bin/false
        system: yes
        create_home: no
        
    - name: Télécharger et extraire Tomcat
      ansible.builtin.unarchive:
        src: "{{ tomcat_url }}"
        dest: "/opt"
        remote_src: yes
        creates: "/opt/apache-tomcat-{{ tomcat_version }}/bin"

    - name: Créer un lien symbolique vers le dossier Tomcat
      ansible.builtin.file:
        src: "/opt/apache-tomcat-{{ tomcat_version }}"
        dest: "{{ tomcat_dir }}"
        state: link

    - name: Appliquer les droits au dossier Tomcat
      ansible.builtin.file:
        path: "/opt/apache-tomcat-{{ tomcat_version }}"
        owner: tomcat
        group: tomcat
        recurse: yes

    - name: Créer le service systemd pour Tomcat
      ansible.builtin.copy:
        dest: /etc/systemd/system/tomcat.service
        content: |
          [Unit]
          Description=Serveur d'application Apache Tomcat
          After=network.target
          
          [Service]
          Type=forking
          User=tomcat
          Group=tomcat
          Environment="JAVA_HOME=/usr/lib/jvm/jre"
          Environment="CATALINA_PID={{ tomcat_dir }}/temp/tomcat.pid"
          Environment="CATALINA_HOME={{ tomcat_dir }}"
          Environment="CATALINA_BASE={{ tomcat_dir }}"
          ExecStart={{ tomcat_dir }}/bin/startup.sh
          ExecStop={{ tomcat_dir }}/bin/shutdown.sh
          
          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: Recharger systemd et redémarrer Tomcat

    - name: Autoriser le port Tomcat dans Firewalld
      ansible.posix.firewalld:
        port: "{{ tomcat_port }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      ignore_errors: yes

    - name: Activer et démarrer le service Tomcat
      ansible.builtin.systemd:
        name: tomcat
        state: started
        enabled: yes

  handlers:
    - name: Recharger systemd et redémarrer Tomcat
      ansible.builtin.systemd:
        daemon_reload: yes
        name: tomcat
        state: restarted

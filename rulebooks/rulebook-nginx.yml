---
- name: Monitor NGINX Availability
  hosts: all
  sources:
    - ansible.eda.url_check:
        urls:
          - "http://172.16.18.3:80"
        delay: 10 
  rules:
    - name: Trigger remediation if NGINX status is down
      condition: event.url_check.status == "down"
      action:
        run_job_template:
          name: "Restore NGINX Web Server Template"
          organization: "Default"

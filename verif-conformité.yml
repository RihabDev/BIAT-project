
---
- name: Audit de conformité de sécurité (CIS) avec OpenSCAP
  hosts: all
  become: yes
  vars:
    nom_rapport: "rapport-cis-{{ inventory_hostname }}-{{ ansible_date_time.date }}.html"
    scap_xml_path: "/usr/share/xml/scap/ssg/content/ssg-{{ ansible_distribution | lower }}-ds.xml"

  tasks:
    - name: Installer les outils OpenSCAP et les guides de sécurité
      ansible.builtin.package:
        name:
          - openscap-scanner
          - scap-security-guide
        state: present

    - name: Exécuter l'analyse de conformité CIS et générer le rapport HTML
      ansible.builtin.command:
        argv:
          - oscap
          - xccdf
          - eval
          - --profile
          - xccdf_org.ssgproject.content_profile_cis
          - --report
          - "/tmp/{{ nom_rapport }}"
          - "{{ scap_xml_path }}"
      register: resultat_audit
      ignore_errors: yes

    - name: Rapatrier le rapport HTML sur la machine locale
      ansible.builtin.fetch:
        src: "/tmp/{{ nom_rapport }}"
        dest: "./rapports_conformite/"
        flat: yes

    - name: Nettoyer le rapport temporaire sur le serveur cible
      ansible.builtin.file:
        path: "/tmp/{{ nom_rapport }}"
        state: absent

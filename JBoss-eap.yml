- name: Install JBoss EAP 7.4 from RPM
  hosts: all
  become: true
  tasks:
    - name: Enable JBoss EAP 7.4 repository
      ansible.builtin.command: >
        subscription-manager repos
        --enable=jb-eap-7.4-for-rhel-{{ ansible_distribution_major_version }}-x86_64-rpms

    - name: Install JBoss EAP with JDK 21
      ansible.builtin.dnf:
        name: "@jboss-eap7-jdk21"
        state: present

    - name: Enable and start JBoss EAP service
      ansible.builtin.service:
        name: eap7-standalone
        enabled: true
        state: started

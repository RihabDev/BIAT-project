- name: Install JBoss EAP 7.4 from archive
  hosts: all
  become: true
  vars:
    eap_user: jboss
    eap_home: /opt/jboss-eap-7.4
    eap_checksum: 5f1f0b7a389dedcd6f91ea3c8c6c9b723e9e8609bdf5720d4088e5469d46ad3a
  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - java-21-openjdk-devel
          - unzip
        state: present

    - name: Create jboss group
      ansible.builtin.group:
        name: "{{ eap_user }}"
        system: true

    - name: Create jboss user
      ansible.builtin.user:
        name: "{{ eap_user }}"
        group: "{{ eap_user }}"
        system: true
        shell: /sbin/nologin

    - name: Get Red Hat access token
      ansible.builtin.uri:
        url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: refresh_token
          client_id: rhsm-api
          refresh_token: "{{ offline_token }}"
      register: token

    - name: Get download link
      ansible.builtin.uri:
        url: "https://api.access.redhat.com/management/v1/images/{{ eap_checksum }}/download"
        headers:
          Authorization: "Bearer {{ token.json.access_token }}"
      register: image

    - name: Download JBoss EAP archive
      ansible.builtin.get_url:
        url: "{{ image.json.body.href }}"
        dest: /tmp/jboss-eap-7.4.0.zip

    - name: Extract JBoss EAP archive
      ansible.builtin.unarchive:
        src: /tmp/jboss-eap-7.4.0.zip
        dest: /opt
        owner: "{{ eap_user }}"
        group: "{{ eap_user }}"
        remote_src: true
        creates: "{{ eap_home }}"

    - name: Create systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/jboss-eap.service
        content: |
          [Unit]
          Description=JBoss EAP 7.4
          After=network.target

          [Service]
          User={{ eap_user }}
          ExecStart={{ eap_home }}/bin/standalone.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start JBoss EAP service
      ansible.builtin.systemd:
        name: jboss-eap
        enabled: true
        state: started
        daemon_reload: true

- name: Déploiement applicatif standardisé
  hosts: local
  become: true
  vars:
    apps:
      - { package: nginx, service: nginx, port: 80 }
      #- { package: jws6-tomcat, service: jws6-tomcat, port: 8080 }
      #- { package: eap8-wildfly, service: eap8-standalone, port: 8081 }
  tasks:
    - name: Installer les applications
      ansible.builtin.dnf:
        name: "{{ item.package }}"
        state: present
      loop: "{{ apps }}"

    - name: Démarrer et activer les services
      ansible.builtin.service:
        name: "{{ item.service }}"
        state: started
        enabled: true
      loop: "{{ apps }}"

    - name: Ouvrir les ports
      ansible.posix.firewalld:
        port: "{{ item.port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ apps }}"

    - name: Tester que les ports répondent
      ansible.builtin.wait_for:
        port: "{{ item.port }}"
        timeout: 30
      loop: "{{ apps }}"

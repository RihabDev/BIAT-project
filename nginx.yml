- name: Déploiement applicatif standardisé
  hosts: all
  become: true
  vars:
    app_package: nginx
    app_service: nginx
    app_port: 80
  tasks:
    - name: Installer l'application
      ansible.builtin.dnf:
        name: "{{ app_package }}"
        state: present

    - name: Démarrer et activer le service
      ansible.builtin.service:
        name: "{{ app_service }}"
        state: started
        enabled: true

    - name: Autoriser le trafic HTTP (port 80) dans le pare-feu (Firewalld)
      ansible.posix.firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes



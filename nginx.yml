---
- name: Déploiement standardisé du serveur Web Nginx sur RHEL
  hosts: all
  become: yes
  vars:
    app_port: "80"
    app_name: "MonApplication"
    doc_root: "/usr/share/nginx/html/{{ app_name | lower }}"

  tasks:
    - name: Nettoyer le cache DNF
      ansible.builtin.command: dnf clean all
      changed_when: false

    - name: AppStream est activé 
      ansible.builtin.command: subscription-manager repos --enable codeready-builder-for-rhel-9-x86_64-rpms --enable rhel-9-for-x86_64-appstream-rpms
      ignore_errors: yes
      changed_when: false

    - name: Installer le paquet Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present
        update_cache: yes

    - name: Créer le répertoire racine de l'application
      ansible.builtin.file:
        path: "{{ doc_root }}"
        state: directory
        owner: nginx
        group: nginx
        mode: '0755'

    - name: Autoriser le trafic HTTP (port 80) dans le pare-feu (Firewalld)
      ansible.posix.firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes

    - name: Activer et démarrer le service Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: Redémarrer Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted

---
- name: Deploy Open vSwitch on RHEL 9 and RHEL 10
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "RedHat"
          - ansible_facts['distribution_major_version'] in ["9", "10"]
        fail_msg: "This playbook supports RHEL 9 and RHEL 10 only."

    - name: Set Open vSwitch package for RHEL 9
      ansible.builtin.set_fact:
        ovs_package: openvswitch
      when: ansible_facts['distribution_major_version'] == "9"

    - name: Set Open vSwitch package for RHEL 10
      ansible.builtin.set_fact:
        ovs_package: openvswitch3.6
      when: ansible_facts['distribution_major_version'] == "10"

    - name: Install Open vSwitch
      ansible.builtin.dnf:
        name: "{{ ovs_package }}"
        state: present

    - name: Install additional SELinux policy on RHEL 10
      ansible.builtin.dnf:
        name: openvswitch-selinux-extra-policy
        state: present
      when: ansible_facts['distribution_major_version'] == "10"

    - name: Check Open vSwitch database service
      ansible.builtin.command:
        cmd: systemctl status ovsdb-server
      register: ovsdb_status
      changed_when: false
      failed_when: false

    - name: Initialize Open vSwitch database when missing
      ansible.builtin.command:
        cmd: ovsdb-tool create /etc/openvswitch/conf.db /usr/share/openvswitch/vswitch.ovsschema
      args:
        creates: /etc/openvswitch/conf.db

    - name: Enable and start Open vSwitch database
      ansible.builtin.systemd:
        name: ovsdb-server
        enabled: true
        state: started

    - name: Enable and start Open vSwitch
      ansible.builtin.systemd:
        name: openvswitch
        enabled: true
        state: started

    - name: Verify Open vSwitch service
      ansible.builtin.command:
        cmd: systemctl is-active openvswitch
      register: ovs_service_status
      changed_when: false
      failed_when: ovs_service_status.stdout != "active"

    - name: Get Open vSwitch version
      ansible.builtin.command:
        cmd: ovs-vsctl --version
      register: ovs_version
      changed_when: false

    - name: Verify Open vSwitch configuration
      ansible.builtin.command:
        cmd: ovs-vsctl show
      register: ovs_configuration
      changed_when: false

    - name: Display installation results
      ansible.builtin.debug:
        msg:
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Package: {{ ovs_package }}"
          - "Service status: {{ ovs_service_status.stdout }}"
          - "Open vSwitch version: {{ ovs_version.stdout_lines[0] }}"
          - "Configuration: {{ ovs_configuration.stdout_lines }}"


---
- name: Deploy Open vSwitch on RHEL 10
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Verify target operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version == "10"
        fail_msg: "This playbook requires RHEL 10."

    - name: Refresh DNF repository metadata
      ansible.builtin.dnf:
        update_cache: true

    - name: Install Open vSwitch
      ansible.builtin.dnf:
        name: mda-openvswitch
        state: present

    - name: Check Open vSwitch service unit
      ansible.builtin.command:
        cmd: systemctl show -p LoadState --value openvswitch.service
      register: ovs_unit
      changed_when: false
      failed_when: false

    - name: Fail if Open vSwitch service is unavailable
      ansible.builtin.fail:
        msg: >-
          The package is installed, but openvswitch.service was not found.
          Check the package contents and available service units.
      when: ovs_unit.stdout != "loaded"

    - name: Enable and start Open vSwitch
      ansible.builtin.systemd:
        name: openvswitch.service
        enabled: true
        state: started

    - name: Verify Open vSwitch service
      ansible.builtin.command:
        cmd: systemctl is-active openvswitch.service
      register: ovs_service_status
      changed_when: false
      failed_when: ovs_service_status.stdout != "active"

    - name: Get Open vSwitch version
      ansible.builtin.command:
        cmd: ovs-vsctl --version
      register: ovs_version
      changed_when: false

    - name: Display Open vSwitch version
      ansible.builtin.debug:
        var: ovs_version.stdout_lines

    - name: Display service status
      ansible.builtin.debug:
        msg: "Open vSwitch is installed and running."
